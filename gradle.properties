org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
version=2.0.0
systemProp.org.gradle.internal.http.disableHead=true
systemProp.org.gradle.internal.repository.transport.http.disableHead=true
systemProp.org.gradle.internal.repository.transport.https.disableHead=true
android.disableLintVital=true
android.enableR8.fullMode=false

# Gradle and host bytecode use JDK 17; Android runtime images link with matching 17/25 toolchains.
org.gradle.java.installations.fromEnv=JAVA_HOME,ORG_GRADLE_JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_25_X64
