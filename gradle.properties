org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
version=1.10.0
systemProp.org.gradle.internal.http.disableHead=true
systemProp.org.gradle.internal.repository.transport.http.disableHead=true
systemProp.org.gradle.internal.repository.transport.https.disableHead=true
android.disableLintVital=true
android.enableR8.fullMode=false

# Gradle, compilation, and linking the Android JVM all use JDK 17.
org.gradle.java.installations.fromEnv=JAVA_HOME,ORG_GRADLE_JAVA_HOME
