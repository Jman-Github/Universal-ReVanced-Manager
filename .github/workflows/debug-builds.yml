name: Debug Builds

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare debug metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Resolve debug version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/resolve-debug-version.mjs

  build:
    name: Build signed debug APKs
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3.0.3

      - name: Setup keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore.jks

      - name: Run JVM unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -Dorg.gradle.java.home="${{ steps.setup-java.outputs.path }}" --no-daemon \
            -PsignAsDebug \
            -Pversion="${{ needs.prepare.outputs.version }}" \
            :app:testDebugUnitTest

      - name: Build debug artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          ./gradlew -Dorg.gradle.java.home="${{ steps.setup-java.outputs.path }}" --no-daemon \
            -Pversion="${{ needs.prepare.outputs.version }}" \
            :app:assembleDev \
            :revanced.v21-runtime-plugin:assembleRelease

      - name: Locate debug artifacts
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          apk_dir="app/build/outputs/apk/dev"
          expected=(
            "${apk_dir}/universal-revanced-manager-v${VERSION}-universal.apk"
            "${apk_dir}/universal-revanced-manager-v${VERSION}-arm64-v8a.apk"
            "${apk_dir}/universal-revanced-manager-v${VERSION}-armeabi-v7a.apk"
            "${apk_dir}/universal-revanced-manager-v${VERSION}-x86.apk"
            "${apk_dir}/universal-revanced-manager-v${VERSION}-x86_64.apk"
            "revanced.v21-runtime-plugin/build/outputs/apk/release/revanced.v21-plugin.apk"
          )
          for artifact in "${expected[@]}"; do
            [[ -f "$artifact" ]] || { echo "Missing expected debug artifact: $artifact" >&2; exit 1; }
          done

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v7
        with:
          name: urv-debug
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/apk/dev/*.apk
            revanced.v21-runtime-plugin/build/outputs/apk/release/revanced.v21-plugin.apk
            app/build/outputs/apk/dev/output-metadata.json
