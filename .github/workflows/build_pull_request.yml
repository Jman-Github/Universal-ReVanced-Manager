name: Build pull request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Test and validate build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3.0.3

      - name: Read latest published APK version code
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python3 .github/scripts/test_pr_version_code.py
          aapt2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2"
          python3 .github/scripts/resolve-pr-version-code.py \
            --repository "$GITHUB_REPOSITORY" --aapt2 "$aapt2"

      - name: Run JVM unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -Dorg.gradle.java.home="${{ steps.setup-java.outputs.path }}" --no-daemon \
            -PsignAsDebug \
            :app:testDebugUnitTest

      - name: Setup release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$KEYSTORE_PASSWORD" || -z "$KEYSTORE_ENTRY_ALIAS" || -z "$KEYSTORE_ENTRY_PASSWORD" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are unavailable. Validating with debug signing; APKs will not be uploaded."
          else
            printf '%s' "$KEYSTORE" | base64 --decode > app/keystore.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate dev APK builds
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          RELEASE_SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          PR_TEST_SUFFIX: pr.${{ github.event.pull_request.number || github.run_id }}
        shell: bash
        run: |
          signing_args=()
          if [[ "$RELEASE_SIGNING_AVAILABLE" != "true" ]]; then
            signing_args+=(-PsignAsDebug)
          fi
          ./gradlew -Dorg.gradle.java.home="${{ steps.setup-java.outputs.path }}" --no-daemon \
            "${signing_args[@]}" \
            -PprTestBuild=true \
            "-PdevVersionSuffix=$PR_TEST_SUFFIX" \
            :app:assembleDev \
            :revanced.v21-runtime-plugin:assembleRelease
          echo "PR build data and regular release data are kept separate to prevent conflicts when switching between release builds and PR artifacts. Because of this, when you install a PR artifact, your app data will appear to be reset. It’s only a clean slate for that specific PR build. Your previous data is still preserved, and once you reinstall the release build you were using before, that data will be restored." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release-signed validation APKs
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: urv-pr-validation
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/dev/*.apk
            revanced.v21-runtime-plugin/build/outputs/apk/release/revanced.v21-plugin.apk