name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      issues: write
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - name: Validate release branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "dev" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Release may only run from dev or main, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Automatic releases are only allowed from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Setup release keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore.jks

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_READ_PACKAGES_TOKEN: ${{ secrets.GPR_READ_PACKAGES_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          ORG_GRADLE_JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Upload release workflow artifacts
        if: steps.semantic-release.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: urv-${{ steps.semantic-release.outputs.new_release_git_tag }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release-assets/*.apk
            app/build/outputs/apk/**/output-metadata.json

      - name: Attest release APKs
        if: steps.semantic-release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: Universal ReVanced Manager ${{ steps.semantic-release.outputs.new_release_git_tag }}
          subject-path: release-assets/*.apk
