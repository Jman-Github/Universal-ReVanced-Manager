name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: read
      issues: write
      pull-requests: write
      statuses: write
      id-token: write
      attestations: write

    steps:
      - name: Validate release branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "dev" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Release may only run from dev or main, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Automatic releases are only allowed from main." >&2
            exit 1
          fi

      - name: Require Crowdin download for stable promotion
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          dev_head=""
          commit_message="$(gh api "repos/${GH_REPO}/commits/${MAIN_SHA}" --jq '.commit.message')"
          trailer_regex='^Crowdin-Dev-Head: ([0-9a-fA-F]{40})$'
          while IFS= read -r line; do
            if [[ "${line}" =~ ${trailer_regex} ]]; then
              dev_head="${BASH_REMATCH[1]}"
            fi
          done <<< "${commit_message}"

          if [[ -z "${dev_head}" ]]; then
            for attempt in 1 2 3 4 5; do
              dev_head="$(gh api "repos/${GH_REPO}/commits/${MAIN_SHA}/pulls" | \
                jq -r '[.[] | select(.base.ref == "main" and .head.ref == "dev" and .merged_at != null)] | sort_by(.merged_at) | .[-1].head.sha // empty')"
              [[ -n "${dev_head}" ]] && break
              sleep 2
            done
          fi

          if [[ -z "${dev_head}" ]]; then
            echo "Stable releases must come from a merged dev -> main pull request or a generated release commit that records its verified dev head." >&2
            exit 1
          fi

          crowdin_state="$(gh api "repos/${GH_REPO}/commits/${dev_head}/statuses" \
            --jq '[.[] | select(.context == "Crowdin download completed")][0].state // empty')"

          if [[ "${crowdin_state}" != "success" ]]; then
            echo "Crowdin Download Translations must complete successfully on dev commit ${dev_head} before merging to main." >&2
            echo "Current Crowdin status: ${crowdin_state:-missing}" >&2
            exit 1
          fi

          echo "CROWDIN_VERIFIED_DEV_SHA=${dev_head}" >> "${GITHUB_ENV}"
          echo "Crowdin download verified for dev commit ${dev_head}."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Setup release keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore.jks

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_READ_PACKAGES_TOKEN: ${{ secrets.GPR_READ_PACKAGES_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          ORG_GRADLE_JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Upload release workflow artifacts
        if: steps.semantic-release.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: urv-${{ steps.semantic-release.outputs.new_release_git_tag }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release-assets/*.apk
            app/build/outputs/apk/**/output-metadata.json

      - name: Attest release APKs
        if: steps.semantic-release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: Universal ReVanced Manager ${{ steps.semantic-release.outputs.new_release_git_tag }}
          subject-path: release-assets/*.apk

      - name: Ensure next dev to main pull request exists
        if: github.ref_name == 'main' && steps.semantic-release.outputs.new_release_published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run open_pull_request.yml --ref dev
