name: Release

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Extract release notes
        id: changelog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'api/CHANGELOG.md';
          if (!fs.existsSync(p)) throw new Error(`Changelog not found at ${p}`);
          const lines = fs.readFileSync(p, 'utf8').split(/\r?\n/);
          const section = [];
          for (let i = 0; i < lines.length; i += 1) {
            const line = lines[i];
            if (i > 0 && /^#\s*v/i.test(line)) break;
            section.push(line);
          }
          const content = section.join('\n').replace(/\s+$/, '');
          if (!content.trim()) throw new Error('No release notes content extracted from changelog.');
          const header = section.find((l) => /^#\s*v/i.test(l));
          if (!header) throw new Error('Failed to locate version header in changelog.');
          const m = header.match(/^#\s*(v[0-9]+\.[0-9]+\.[0-9]+)/i);
          if (!m) throw new Error(`Unable to parse version from changelog header: "${header}"`);
          const version = m[1];
          fs.writeFileSync('release_notes.md', `${content}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          retention-days: 1
          if-no-files-found: error
          path: release_notes.md

  build:
    name: Build release APK (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        profile: [LITE, FULL]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > "app/keystore.jks"

      - name: Build release
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER }}
          GITHUB_TOKEN: ${{ secrets.GPR_READ_PACKAGES_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          ./gradlew -Dorg.gradle.java.home="${{ steps.setup-java.outputs.path }}" --no-daemon \
            -PurvBuildProfile="${{ matrix.profile }}" \
            assembleRelease

      - name: Locate release artifacts
        id: artifact
        env:
          PROFILE: ${{ matrix.profile }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APK_DIR="app/build/outputs/apk/release"
          EXPECTED=(
            "${PROFILE}-universal-revanced-manager-${VERSION}-universal.apk"
            "${PROFILE}-universal-revanced-manager-${VERSION}-arm64-v8a.apk"
            "${PROFILE}-universal-revanced-manager-${VERSION}-armeabi-v7a.apk"
            "${PROFILE}-universal-revanced-manager-${VERSION}-x86.apk"
            "${PROFILE}-universal-revanced-manager-${VERSION}-x86_64.apk"
          )
          for name in "${EXPECTED[@]}"; do
            if [ ! -f "$APK_DIR/$name" ]; then
              echo "Missing expected release APK artifact: $APK_DIR/$name"
              ls -la "$APK_DIR" || true
              exit 1
            fi
            echo "Found $APK_DIR/$name"
          done
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: urv-release-${{ matrix.profile }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ steps.artifact.outputs.apk_dir }}/${{ matrix.profile }}-universal-revanced-manager-${{ needs.prepare.outputs.version }}-universal.apk
            ${{ steps.artifact.outputs.apk_dir }}/${{ matrix.profile }}-universal-revanced-manager-${{ needs.prepare.outputs.version }}-arm64-v8a.apk
            ${{ steps.artifact.outputs.apk_dir }}/${{ matrix.profile }}-universal-revanced-manager-${{ needs.prepare.outputs.version }}-armeabi-v7a.apk
            ${{ steps.artifact.outputs.apk_dir }}/${{ matrix.profile }}-universal-revanced-manager-${{ needs.prepare.outputs.version }}-x86.apk
            ${{ steps.artifact.outputs.apk_dir }}/${{ matrix.profile }}-universal-revanced-manager-${{ needs.prepare.outputs.version }}-x86_64.apk
            app/build/outputs/apk/release/output-metadata.json

  publish:
    name: Publish release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: urv-release-*
          merge-multiple: true
          path: release-artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Prepare release tag
        id: release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "Version extracted from changelog is empty."
            exit 1
          fi
          echo "NEW_TAG=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Name GitHub Release
        if: steps.release.outputs.NEW_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.NEW_TAG }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Universal ReVanced Manager $TAG" --notes-file release_notes.md
          else
            gh release edit "$TAG" --title "Universal ReVanced Manager $TAG" --notes-file release_notes.md
          fi

      - name: Upload APK assets
        if: steps.release.outputs.NEW_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.NEW_TAG }}
        run: |
          gh release upload "$TAG" release-artifacts/*.apk --clobber

      - name: Attest
        if: steps.release.outputs.NEW_TAG != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Universal ReVanced Manager ${{ steps.release.outputs.NEW_TAG }}
          subject-path: release-artifacts/*.apk
